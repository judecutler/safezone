<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--paper:#FBF8F1;--paper2:#F3EEE2;--ink:#17150F;--muted:#6B655A;--hair:#D9D2C3;--accent:#FFC629;--soft:#FFF1C2;
--s1:#FFD84D;--s2:#FFB020;--s3:#FF7A1A;--s4:#E8322B;--night:#0E0D0A;--night2:#1A1813;--cream:#FFF8E6;--green:#00875A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--night)}
body{font-family:Inter,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#s{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.dark{background:var(--night);color:var(--cream)}
.paper{background:var(--paper);color:var(--ink)}
.mono{font-family:"DejaVu Sans Mono",monospace;letter-spacing:.02em}
.disp{font-family:"Inter Display",Inter,sans-serif;font-weight:900;letter-spacing:-.02em;line-height:.95}
.kick{font-family:"DejaVu Sans Mono",monospace;font-size:22px;letter-spacing:.14em;text-transform:uppercase}
.src{font-family:"DejaVu Sans Mono",monospace;font-size:17px;opacity:.6}
.phone{position:absolute;border:14px solid #0b0a08;border-radius:58px;overflow:hidden;background:#000;box-shadow:0 40px 80px -30px rgba(0,0,0,.6),0 0 0 2px #2a2822}
.phone img{position:absolute;left:0;top:0;display:block}
.tag{display:inline-block;font-family:"DejaVu Sans Mono",monospace;font-size:18px;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border:2px solid currentColor;border-radius:6px}
.chip{display:inline-flex;align-items:center;gap:12px;padding:14px 22px;border:3px solid var(--ink);border-radius:999px;font-weight:700;font-size:28px;background:#fff}
.card{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:28px 32px;box-shadow:0 12px 0 -4px rgba(23,21,15,.12)}
.dcard{background:var(--night2);border:2px solid #3a362c;border-radius:18px;padding:28px 32px}
.meta{font-weight:800}
.cap{position:absolute;left:0;right:0;bottom:44px;text-align:center}
.cap span{display:inline-block;max-width:1500px;background:rgba(14,13,10,.82);color:var(--cream);font-size:30px;line-height:1.3;padding:10px 22px;border-radius:10px;font-weight:500}
.hazard-stripes{background:repeating-linear-gradient(-45deg,var(--accent) 0 16px,#FFD96B 16px 32px)}
.seig{background-image:radial-gradient(circle at 50% 100%,transparent 18px,rgba(143,166,174,.35) 19px,rgba(143,166,174,.35) 21px,transparent 22px,transparent 28px,rgba(143,166,174,.25) 29px,rgba(143,166,174,.25) 31px,transparent 32px);background-size:64px 32px}
</style></head>
<body><div id="s"></div>
<script>
const S = document.getElementById('s');
let TL = null, ROOM = null, BAG = null;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return 1 - Math.pow(1 - x, 3); };
const inout = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const fin = (t, a, d = .5) => ease((t - a) / d);
const fio = (t, a, b, d = .4) => Math.min(fin(t, a, d), 1 - ease((t - (b - d)) / d));
const up = (t, a, d = .6, px = 40) => { const e = fin(t, a, d); return `opacity:${e};transform:translateY(${(1 - e) * px}px)`; };
const pop = (t, a, d = .45) => { const e = fin(t, a, d); const s = .8 + .2 * e + Math.sin(e * Math.PI) * .06; return `opacity:${e};transform:scale(${s})`; };
const pad = (n, k = 4) => String(n).padStart(k, '0');

// Time inside a narration line at which `word` is spoken (character-proportional).
function cue(seg, word, k = 0) {
  const n = seg.vo; if (!n) return 0;
  let i = -1; for (let j = 0; j <= k; j++) i = n.text.indexOf(word, i + 1);
  return n.at + n.dur * Math.max(0, i) / n.text.length;
}

function phone(src, imgW, x, y, w, scroll = 0, h = null, extra = '') {
  const s = w / (imgW / 3) / 3 * 3; // css px per image px * 3
  const scale = w / imgW;
  const H = h ?? Math.round(w * 2532 / 1170);
  return `<div class="phone" style="left:${x}px;top:${y}px;width:${w + 28}px;height:${H + 28}px;${extra}"><img src="assets/${src}" style="width:${w}px;top:${-scroll * scale}px"></div>`;
}
function caption(t, seg) { return ''; }

// Scenes ---------------------------------------------------------------------------------------------------
const TOLLS = [
  ['1906', 'San Francisco', '3,000+', 'dead', 'USGS'],
  ['1995', 'Kobe, Japan', '6,434', 'dead', 'Cabinet Office of Japan'],
  ['2004', 'Indian Ocean', '227,898', 'dead or missing', 'USGS'],
  ['2011', 'Tōhoku, Japan', '15,901', 'dead · 2,519 still missing', 'National Police Agency, Mar 2026'],
  ['2024', 'Noto, Japan', '722', 'dead', 'Cabinet Office of Japan'],
];
const scenes = {
  tolls(t, seg) {
    const pulse = .5 + .5 * Math.sin(t * Math.PI * 2 / 1.25);
    const rows = TOLLS.map((r, i) => {
      const a = .5 + i * 1.25;
      return `<div style="display:grid;grid-template-columns:150px 430px 520px 1fr;align-items:baseline;gap:20px;padding:20px 0;border-bottom:1px solid #2c2a22;${up(t, a, .5, 24)}">
        <div class="mono" style="font-size:30px;color:var(--accent)">${r[0]}</div>
        <div style="font-size:40px;font-weight:600">${r[1]}</div>
        <div class="disp" style="font-size:84px;color:${i === 3 ? 'var(--s4)' : 'var(--cream)'}">${r[2]}</div>
        <div><div style="font-size:28px;color:#C9C0AC">${r[3]}</div><div class="src">${r[4]}</div></div></div>`;
    }).join('');
    return `<div class="abs dark" style="inset:0"></div>
      <div class="abs" style="inset:0;box-shadow:inset 0 0 ${160 + pulse * 120}px rgba(232,50,43,${.18 + pulse * .22})"></div>
      <div class="abs" style="left:200px;top:120px;right:200px">${rows}</div>`;
  },
  dec5(t, seg) {
    const q = ['Am I in the zone?', 'Where do I go?', 'How long do I have?'];
    return `<div class="abs dark" style="inset:0"></div>
      <div class="abs" style="left:200px;top:170px;${up(t, .1)}"><div class="kick" style="color:var(--accent)">Thursday, Dec 5, 2024 · 10:44 a.m. · Cape Mendocino M7.0</div></div>
      <div class="abs disp" style="left:200px;top:250px;font-size:200px;${up(t, cue(seg, 'Five') - .2)}">5,000,000</div>
      <div class="abs" style="left:205px;top:470px;font-size:46px;font-weight:600;${up(t, cue(seg, 'Californians'))}">Californians under a tsunami warning</div>
      <div class="abs" style="left:200px;top:600px;display:flex;gap:26px">${q.map((s, i) => `<div style="padding:22px 34px;border:3px solid var(--s4);border-radius:999px;font-size:36px;font-weight:700;color:#fff;${pop(t, cue(seg, 'never') + i * .45)}">${s}</div>`).join('')}</div>
      <div class="abs" style="left:205px;top:740px;font-size:30px;color:#C9C0AC;max-width:1300px;${up(t, cue(seg, 'never') + 1.6)}">The alert never said. Berkeley's survey of 1,602 residents found people didn't know where the zone was.</div>
      <div class="abs src" style="left:205px;bottom:90px;${up(t, 1)}">KQED · City of Berkeley after-action report, Apr 2025</div>`;
  },
  gap(t, seg) {
    const card = (big, line, src, a, color) => `<div class="dcard" style="width:700px;${up(t, a)}"><div class="disp" style="font-size:170px;color:${color}">${big}</div><div style="font-size:36px;font-weight:600;margin-top:18px;line-height:1.25">${line}</div><div class="src" style="margin-top:20px">${src}</div></div>`;
    return `<div class="abs dark" style="inset:0"></div>
      <div class="abs" style="left:200px;top:130px;${up(t, .1)}"><div class="kick" style="color:var(--accent)">The preparation gap</div></div>
      <div class="abs" style="left:200px;top:220px;display:flex;gap:120px">
        ${card('31%', 'of US households have learned their evacuation routes', 'FEMA National Household Survey, 2023', cue(seg, 'thirty-one') - .3, 'var(--accent)')}
        ${card('30–50%', 'of earthquake injuries in Japan come from furniture tipping, falling or sliding', 'Tokyo Fire Department, 2024', cue(seg, 'half') - .3, 'var(--s3)')}
      </div>`;
  },
  works(t, seg) {
    const a1 = cue(seg, 'In twenty'), a2 = cue(seg, 'Japan estimates');
    const bar = (lbl, pct, val, color, a) => `<div style="display:grid;grid-template-columns:360px 1fr 120px;gap:24px;align-items:center;margin:16px 0;${up(t, a)}"><div style="font-size:28px">${lbl}</div><div style="height:40px;background:#2a2720;border-radius:8px;overflow:hidden"><div style="height:100%;width:${pct * fin(t, a + .2, 1.2) * 100}%;background:${color}"></div></div><div class="mono" style="font-size:30px">${val}</div></div>`;
    const n = Math.round(215000 - (215000 - 73000) * inout((t - a2 - 1.4) / 2.2));
    return `<div class="abs dark" style="inset:0"></div>
      <div class="abs" style="left:200px;top:110px;${up(t, .1)}"><div class="kick" style="color:var(--accent)">Preparation works</div></div>
      <div class="abs dcard" style="left:200px;top:190px;width:1520px;${up(t, a1 - .2)}">
        <div style="display:flex;align-items:baseline;gap:30px"><div class="disp" style="font-size:120px;color:var(--s4)">10×</div><div style="font-size:36px;font-weight:600">more likely to be caught by the wave when you leave at the last minute</div></div>
        ${bar('Left right away', .048 / .55, '4.8%', 'var(--accent)', a1 + .8)}${bar('Left at the last minute', .49 / .55, '49%', 'var(--s4)', a1 + 1.3)}
        <div class="src">Cabinet Office of Japan, interviews of 2011 survivors (n = 857)</div></div>
      <div class="abs dcard" style="left:200px;top:640px;width:1520px;${up(t, a2 - .2)}">
        <div style="display:flex;align-items:baseline;gap:36px"><div class="disp" style="font-size:120px;color:var(--accent)">−70%</div>
        <div style="font-size:34px;font-weight:600;line-height:1.3">projected Nankai Trough tsunami deaths if everyone<br>starts evacuating within 10 minutes</div>
        <div class="mono" style="margin-left:auto;font-size:44px;font-weight:700">${n.toLocaleString('en-US')}</div></div>
        <div class="src" style="margin-top:12px">Cabinet Office of Japan damage estimate, Mar 2025: about 215,000 → about 73,000</div></div>`;
  },
  title(t, seg) {
    const steps = ['Prepare', 'Stand by', 'Shaking', 'Get out', 'Shelter'];
    const a = cue(seg, 'gets');
    const wipe = inout(t / .8);
    return `<div class="abs dark" style="inset:0"></div>
      <div class="abs paper" style="left:0;top:0;bottom:0;width:${wipe * 1920}px"></div>
      <div class="abs" style="left:200px;top:180px;display:flex;align-items:center;gap:40px;${pop(t, .5, .6)}">
        <img src="assets/icon.svg" style="width:170px;height:170px;border-radius:38px;border:4px solid var(--ink)">
        <div><div class="disp" style="font-size:150px">SafeZone</div><div class="jp" style="font-family:'Noto Sans CJK JP';font-size:30px;color:var(--muted);margin-top:6px">避難計画 · household quake and tsunami plan</div></div></div>
      <div class="abs" style="left:200px;top:430px;display:flex;align-items:center;gap:22px;${up(t, cue(seg, 'Meta') - .2)}">
        <div style="font-size:40px;font-weight:500">Built on</div><div class="chip" style="font-size:40px;background:var(--ink);color:#fff;border-color:var(--ink)"><span class="meta">Meta</span> SAM 3.1</div><div style="font-size:40px">+</div><div class="chip" style="font-size:40px;background:var(--ink);color:#fff;border-color:var(--ink)"><span class="meta">Meta</span> Muse Spark</div></div>
      <div class="abs" style="left:200px;top:640px;right:200px;display:flex;gap:0;align-items:center">${steps.map((s, i) => `
        <div style="${pop(t, a + i * .35)};display:flex;align-items:center"><div style="width:260px;padding:26px 0;text-align:center;border:3px solid var(--ink);border-radius:18px;background:${i < 1 ? 'var(--accent)' : i < 2 ? '#fff' : i < 4 ? 'var(--night)' : '#fff'};color:${i >= 2 && i < 4 ? 'var(--cream)' : 'var(--ink)'}"><div class="mono" style="font-size:20px;opacity:.7">0${i + 1}</div><div style="font-size:34px;font-weight:800">${s}</div></div>${i < 4 ? '<div style="width:42px;height:4px;background:var(--ink)"></div>' : ''}</div>`).join('')}</div>`;
  },
  hazard(t, seg) {
    return `<div class="abs paper" style="inset:0"></div>
      ${phone('p-review.jpg', 1170, 1220, 70 - 0 * 20, 440, 230 + 400 * inout((t - 3) / 4))}
      <div class="abs" style="left:200px;top:180px;${up(t, .1)}"><div class="kick">01 · Prepare</div></div>
      <div class="abs disp" style="left:200px;top:240px;font-size:110px;max-width:900px;${up(t, .3)}">Is this home in the zone?</div>
      <div class="abs card" style="left:200px;top:540px;width:860px;${up(t, cue(seg, 'official') - .2)}"><div class="kick" style="color:var(--muted);font-size:18px">Official hazard maps, not a guess</div>
        <div style="font-size:32px;font-weight:700;margin-top:12px">California Geological Survey tsunami hazard area</div>
        <div style="font-size:32px;font-weight:700;margin-top:8px">Japan: Hazard Map Portal + GSI evacuation sites</div></div>
      <div class="abs" style="left:200px;top:820px;${pop(t, cue(seg, 'inside'))}"><span class="tag" style="color:var(--s4);font-size:26px;border-width:3px">⚠ Inside the tsunami hazard area</span></div>`;
  },
  sam(t, seg) { return roomScene(t, seg, 'sam'); },
  muse(t, seg) { return roomScene(t, seg, 'muse'); },
  guard(t, seg) {
    const checks = ['Outside the photo', 'In a doorway', 'On or inside furniture', 'Above the floor line', 'In a tall object\'s tip zone', 'Below stored items', 'Close to glass'];
    const a = cue(seg, 'suggested');
    return `<div class="abs paper" style="inset:0"></div>
      <div class="abs" style="left:150px;top:110px;${up(t, .1)}"><div class="kick">Code checks the model · room/score.py</div></div>
      <div class="abs card" style="left:150px;top:190px;width:640px;${up(t, a - .3)}"><div class="kick" style="font-size:18px;color:var(--muted)">Meta Muse Spark proposed</div><div style="font-size:34px;font-weight:700;margin-top:10px">“Drop on the floor here, by the door.”</div></div>
      <div class="abs" style="left:150px;top:420px;width:640px">${checks.map((c, i) => `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:2px solid var(--hair);font-size:28px;${up(t, a + .6 + i * .18, .3, 12)}"><span>${c}</span><span class="mono" style="font-weight:700;color:${i === 1 ? 'var(--s4)' : 'var(--green)'}">${i === 1 ? '✗ FAIL' : 'pass'}</span></div>`).join('')}</div>
      <div class="abs" style="left:430px;top:334px;${pop(t, cue(seg, 'set aside'), .35)};transform-origin:center"><div style="border:5px solid var(--s4);color:var(--s4);font-weight:900;font-size:36px;padding:6px 20px;border-radius:10px;transform:rotate(-6deg);background:rgba(251,248,241,.95)">SET ASIDE · IN A DOORWAY</div></div>
      <div class="abs disp" style="left:880px;top:200px;font-size:96px;${up(t, cue(seg, 'proposes') - .2)}">The model proposes.</div>
      <div class="abs disp" style="left:880px;top:310px;font-size:96px;color:var(--s3);${up(t, cue(seg, 'Code decides') - .2)}">Code decides.</div>
      ${phone('p-review.jpg', 1170, 1300, 450, 380, 2532 + 640, 560, up(t, a + 1))}
      <div class="abs" style="left:880px;top:470px;width:380px;font-size:26px;line-height:1.4;color:var(--muted);${up(t, a + 1.4)}">Fixes come only from a fixed table, never from model text. The app shows the model's words as labelled context.</div>`;
  },
  react(t, seg) {
    const n = clamp(Math.floor(t * 30) + 1, 1, 119);
    return `<div class="abs paper seig" style="inset:0"></div>
      <div class="abs" style="left:${960 - 281}px;top:40px;width:562px;height:1000px;border:6px solid var(--ink);border-radius:28px;overflow:hidden;${pop(t, 0, .3)}"><img src="assets/react/${pad(n)}.jpg" style="width:100%;height:100%;object-fit:cover"></div>
      <div class="abs" style="left:1300px;top:820px;${up(t, .4)}"><span class="tag" style="background:#fff">The builder, seeing it work</span></div>`;
  },
  gobag(t, seg) {
    const shown = BAG.slice(0, 14);
    return `<div class="abs paper" style="inset:0"></div>
      <div class="abs" style="left:150px;top:90px;${up(t, .1)}"><div class="kick">Go bag · Meta Muse Spark vs Ready.gov's 14-item kit</div></div>
      <div class="abs" style="left:150px;top:160px;width:480px;height:853px;border:4px solid var(--ink);border-radius:20px;overflow:hidden;${up(t, .2)}"><img src="assets/gobag.jpg" style="width:100%;height:100%;object-fit:cover"></div>
      <div class="abs" style="left:720px;top:160px;width:1050px;columns:2;column-gap:50px">${shown.map((it, i) => `<div style="break-inside:avoid;display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:2px solid var(--hair);${up(t, .6 + i * .12, .3, 10)}"><span style="font-size:26px;font-weight:${it.seen ? 800 : 500}">${it.seen ? '<span style="color:var(--green)">✓</span> ' : '<span style="color:var(--muted)">?</span> '}${it.label}</span><span class="mono" style="font-size:18px;white-space:nowrap;color:${it.seen ? 'var(--green)' : 'var(--muted)'}">${it.seen ? 'Seen' : 'Not seen'}</span></div>`).join('')}</div>
      <div class="abs card" style="left:720px;top:820px;width:1050px;${up(t, cue(seg, 'never') - .2)}"><div style="font-size:30px;font-weight:700">2 of 14 seen. It never says the kit is enough.</div><div class="src" style="opacity:.8;margin-top:8px">Recorded Muse Spark answer · items out of view may still be packed</div></div>`;
  },
  route(t, seg) {
    const checks = ['Ends outside the official hazard area', 'Ends on mapped land, not the beach', 'Never goes deeper into the zone than home', 'Never doubles back toward the water', 'Walking pace 1.0 m/s, for children and elders', 'Stored on the phone for offline use'];
    const a = cue(seg, 'Every');
    return `<div class="abs paper" style="inset:0"></div>
      ${phone('p-place.jpg', 1170, 1250, 40, 460, 2532 + 1030 + 500 * inout((t - 7) / 5))}
      <div class="abs" style="left:150px;top:110px;${up(t, .1)}"><div class="kick">The route · OSRM on OpenStreetMap, checked in code</div></div>
      <div class="abs" style="left:150px;top:190px;display:flex;gap:40px;align-items:baseline;${up(t, cue(seg, 'ten minutes') - .4)}"><div class="disp" style="font-size:150px">10 min</div><div class="disp" style="font-size:110px;color:var(--muted)">600 m</div></div>
      <div class="abs" style="left:150px;top:400px;width:950px">${checks.map((c, i) => `<div style="display:flex;gap:20px;align-items:center;padding:16px 0;border-bottom:2px solid var(--hair);font-size:32px;font-weight:600;${up(t, a + .3 + i * .65, .35, 14)}"><span style="display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--accent);border:3px solid var(--ink);font-size:24px">✓</span>${c}</div>`).join('')}</div>`;
  },
  japan(t, seg) {
    return `<div class="abs paper seig" style="inset:0"></div>
      ${phone('kamakura.png', 780, 1250, 40, 460, 1520 + 280 * inout((t - 2) / 4))}
      <div class="abs" style="left:150px;top:150px;${up(t, .1)}"><div class="kick">Japan · 鎌倉市 由比ガ浜</div></div>
      <div class="abs disp" style="left:150px;top:210px;font-size:96px;max-width:1000px;${up(t, .3)}">Official Japanese data</div>
      <div class="abs card" style="left:150px;top:350px;width:980px;${up(t, cue(seg, 'official') - .2)}">
        <div style="font-family:'Noto Sans CJK JP';font-size:30px;font-weight:700">ハザードマップポータルサイト<span style="font-family:Inter;font-weight:500;color:var(--muted)"> · tsunami inundation, 1 m to 3 m</span></div>
        <div style="font-family:'Noto Sans CJK JP';font-size:30px;font-weight:700;margin-top:12px">指定緊急避難場所（国土地理院）<span style="font-family:Inter;font-weight:500;color:var(--muted)"> · designated sites</span></div>
        <div style="font-family:'Noto Sans CJK JP';font-size:30px;font-weight:700;margin-top:12px">内閣府 · 気象庁<span style="font-family:Inter;font-weight:500;color:var(--muted)"> · guidance quoted word for word</span></div></div>
      <div class="abs card" style="left:150px;top:680px;width:980px;border-color:var(--s4);${up(t, cue(seg, 'Where') - .2)}"><div style="font-size:32px;font-weight:800">No route passed the checks here. So it says so.</div><div style="font-size:26px;color:var(--muted);margin-top:8px">Recorded Nov 4: it gives the official advice and lists the 10 nearest designated sites.</div></div>`;
  },
  bench(t, seg) {
    const items = [['Knows whether home is in the zone', 'Berkeley residents didn\'t'], ['Has a checked evacuation route', 'only 31% of US households'], ['Found what can fall in each room', '30–50% of injuries'], ['Checked the go bag', 'Ready.gov kit'], ['All of it saved offline', 'no signal needed']];
    return `<div class="abs paper" style="inset:0"></div>
      <div class="abs" style="left:200px;top:120px;${up(t, .1)}"><div class="kick">After about 5 minutes of setup, this household:</div></div>
      <div class="abs" style="left:200px;top:200px;width:1520px">${items.map((it, i) => `<div style="display:flex;gap:28px;align-items:center;padding:22px 0;border-bottom:3px solid var(--ink);${up(t, .3 + i * .45, .35, 16)}"><span style="display:inline-grid;place-items:center;width:64px;height:64px;border-radius:14px;background:var(--accent);border:3px solid var(--ink);font-size:38px;font-weight:900">✓</span><span style="font-size:48px;font-weight:800">${it[0]}</span><span class="mono" style="margin-left:auto;font-size:24px;color:var(--muted)">${it[1]}</span></div>`).join('')}</div>`;
  },
  shake(t, seg) {
    const j = t < 4 ? Math.sin(t * 47) * 6 * (1 - t / 4) : 0;
    return `<div class="abs dark" style="inset:0"></div>
      <div class="abs" style="left:0;right:0;top:0;height:14px" class="hazard-stripes"></div>
      <div class="abs" style="left:150px;top:150px;${up(t, .1)}"><div class="kick" style="color:var(--accent)">02 · When it happens</div></div>
      <div class="abs disp" style="left:150px;top:230px;font-size:150px;transform:translateX(${j}px)">DROP.<br>COVER.<br><span style="color:var(--accent)">HOLD ON.</span></div>
      ${phone('shaking.png', 780, 1250, 40, 460, 0, null, `transform:translateX(${j}px)`)}
      <div class="abs" style="left:150px;top:760px;width:950px">${['Says one thing, repeated every 15 s, with your saved spot', 'Nothing on this screen tells you to move', 'Taps in the first 3 s are ignored', 'One way forward: “Shaking has stopped”'].map((c, i) => `<div style="font-size:28px;padding:8px 0;color:#E9E1CC;${up(t, cue(seg, 'Nothing') - .6 + i * .5, .35, 10)}">— ${c}</div>`).join('')}</div>`;
  },
  clip(t, seg) { return clipScene(t, seg, seg.from); },
  after(t, seg) {
    const src = t < 3.9 ? seg.from + t : 22 + (t - 3.9);
    const chips = ['Go now, on foot', 'Turn-by-turn, spoken', 'Works with no signal', 'Shelters that fit: wheelchair · pets · medical'];
    return clipScene(t, seg, src, false) + `<div class="abs" style="left:1180px;top:300px;width:620px">${chips.map((c, i) => `<div style="margin:0 0 22px;${pop(t, [cue(seg, 'go now'), cue(seg, 'turn by turn'), cue(seg, 'no signal'), cue(seg, 'shelters')][i] - .2)}"><span class="chip" style="background:${i === 0 ? 'var(--accent)' : 'var(--night2)'};color:${i === 0 ? 'var(--ink)' : 'var(--cream)'};border-color:${i === 0 ? 'var(--ink)' : '#4a4538'}">${c}</span></div>`).join('')}</div>`;
  },
  close(t, seg) {
    return `<div class="abs dark" style="inset:0"></div>
      <div class="abs" style="left:200px;top:110px;right:200px;opacity:${.35 * fio(t, 0, cue(seg, 'Getting'), .6)}">${TOLLS.map((r) => `<div style="display:flex;gap:30px;align-items:baseline;padding:10px 0"><span class="mono" style="font-size:26px;color:var(--accent)">${r[0]}</span><span style="font-size:32px">${r[1]}</span><span class="disp" style="font-size:60px">${r[2]}</span></div>`).join('')}</div>
      <div class="abs disp" style="left:200px;top:300px;font-size:120px;${up(t, cue(seg, 'Getting') - .2)}">Get out early.</div>
      <div class="abs disp" style="left:200px;top:430px;font-size:120px;color:var(--accent);${up(t, cue(seg, 'securing') - .2)}">Secure the room.</div>
      <div class="abs" style="left:205px;top:640px;font-size:44px;font-weight:600;max-width:1400px;line-height:1.3;${up(t, cue(seg, 'Safe Zone') - .2)}">SafeZone puts that preparation in every home: prepare once, then follow the plan.</div>`;
  },
  end(t, seg) {
    return `<div class="abs paper" style="inset:0"></div>
      <div class="abs" style="left:0;right:0;top:170px;display:flex;justify-content:center;align-items:center;gap:40px;${pop(t, .1, .6)}"><img src="assets/icon.svg" style="width:190px;height:190px;border-radius:42px;border:4px solid var(--ink)"><div class="disp" style="font-size:170px">SafeZone</div></div>
      <div class="abs" style="left:0;right:0;top:440px;text-align:center;${up(t, cue(seg, 'Built'))}"><div style="display:inline-flex;gap:20px;align-items:center;font-size:40px">Built on <span class="chip" style="font-size:40px;background:var(--ink);color:#fff"><span class="meta">Meta</span> SAM 3.1</span> + <span class="chip" style="font-size:40px;background:var(--ink);color:#fff"><span class="meta">Meta</span> Muse Spark</span></div></div>
      <div class="abs" style="left:0;right:0;top:600px;text-align:center;${up(t, cue(seg, 'Prepare'))}"><div class="disp" style="font-size:72px">Prepare once. Then follow the plan.</div></div>
      <div class="abs mono" style="left:0;right:0;top:760px;text-align:center;font-size:34px;${up(t, cue(seg, 'Prepare') + .8)}">safezone-alpha-one.vercel.app<br><span style="font-size:26px;color:var(--muted)">github.com/judecutler/safezone · Jude Cutler · Meta Global AI Developer Hackathon</span></div>`;
  },
};

function clipScene(t, seg, srcT, label = true) {
  const n = clamp(Math.floor(srcT * 30) + 1, 1, 772);
  return `<div class="abs dark" style="inset:0"></div>
    <div class="abs" style="left:${label ? 679 : 480}px;top:40px;width:562px;height:1000px;border-radius:28px;overflow:hidden;border:3px solid #3a362c"><img src="assets/phone/${pad(n)}.jpg" style="width:100%;height:100%"></div>
    ${label ? `<div class="abs" style="left:1300px;top:480px;${up(t, .3)}"><span class="tag" style="color:var(--accent)">Live app on a real phone · demo mode</span><div style="color:#C9C0AC;font-size:28px;margin-top:20px;max-width:520px;line-height:1.35">The app speaks: “This is a demo. Drop, cover and hold on…”</div></div>` : ''}`;
}

function roomScene(t, seg, mode) {
  const W = 1100, H = W * 900 / 1600, X = 120, Y = 200;
  const hz = { tall_furniture: 'var(--s3)', heavy_up_high: 'var(--s4)', swings_open: 'var(--s2)' };
  const drawP = mode === 'sam' ? fin(t, cue(seg, 'outlines') - .3, 3.2) : 1;
  const paths = ROOM.objs.map((o, i) => {
    const c = o.role === 'hazard' ? (hz[o.kind] ?? 'var(--s3)') : '#fff';
    const p = clamp(drawP * ROOM.objs.length - i * .6, 0, 1);
    return `<path d="${o.outline}" fill="${o.role === 'hazard' ? 'rgba(255,122,26,.18)' : 'rgba(255,255,255,.08)'}" fill-opacity="${p}" stroke="${c}" stroke-width="5" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - p}" stroke-linejoin="round"/>`;
  }).join('');
  const prompts = ['wardrobe', 'cabinet', 'bookshelf', 'bed', 'table', 'desk', 'door', 'window', 'mirror', 'box', 'lamp', 'tv', 'shelf'];
  const relA = cue(seg, 'This wardrobe'), relB = cue(seg, 'That box');
  const right = mode === 'sam'
    ? `<div class="abs" style="left:1290px;top:200px;width:520px;${up(t, .2)}"><div class="kick">Meta SAM 3.1</div><div style="font-size:30px;font-weight:700;margin:14px 0 22px">13 prompts, sent at once. Masks and boxes back.</div>
       <div style="display:flex;flex-wrap:wrap;gap:12px">${prompts.map((p, i) => `<span class="mono" style="font-size:22px;padding:8px 14px;border:2px solid var(--ink);border-radius:8px;background:${['wardrobe', 'cabinet', 'bed', 'door', 'box'].includes(p) && drawP > .3 ? 'var(--accent)' : '#fff'};${pop(t, .5 + i * .08, .3)}">${p}</span>`).join('')}</div>
       <div class="src" style="opacity:.8;margin-top:26px">Real SAM 3.1 output, recorded Nov 3: 10 objects outlined</div></div>`
    : `<div class="abs" style="left:1290px;top:200px;width:540px"><div class="kick" style="${up(t, .1)}">Meta Muse Spark · strict JSON schema</div>
       ${ROOM.rel.slice(0, 3).map((r, i) => `<div class="card" style="margin-top:22px;padding:20px 24px;${up(t, [relA - .3, relA + .6, relB - .3][i])}"><div class="mono" style="font-size:18px;color:var(--s3)">${r.kind.replace(/_/g, ' ').toUpperCase()}</div><div style="font-size:26px;font-weight:600;margin-top:6px;line-height:1.3">${r.note}</div></div>`).join('')}</div>`;
  const zoom = mode === 'muse' ? 1 + .05 * fin(t, 0, 6) : 1;
  return `<div class="abs paper" style="inset:0"></div>
    <div class="abs" style="left:${X}px;top:110px;${up(t, .1)}"><div class="kick">${mode === 'sam' ? 'One photo per room' : 'How they relate'}</div></div>
    <div class="abs" style="left:${X}px;top:${Y}px;width:${W}px;height:${H}px;border:4px solid var(--ink);border-radius:18px;overflow:hidden;background:#000">
      <div style="position:absolute;inset:0;transform:scale(${zoom});transform-origin:40% 50%">
        <img src="assets/living_room.jpg" style="width:100%;height:100%;filter:${mode === 'muse' ? 'grayscale(.7) brightness(.85)' : `grayscale(${.6 * drawP})`}">
        <svg viewBox="0 0 1600 900" style="position:absolute;inset:0;width:100%;height:100%">${paths}</svg></div></div>
    <div class="abs mono" style="left:${X}px;top:${Y + H + 20}px;font-size:20px;color:var(--muted)">demo/living_room.jpg · outlines are SAM 3.1's own masks</div>
    ${right}`;
}

window.setup = async (tl) => {
  TL = tl;
  ROOM = await (await fetch('assets/room.json')).json();
  BAG = await (await fetch('assets/gobag.json')).json();
};
window.seek = async (T) => {
  const seg = TL.segments.find((s) => T >= s.start && T < s.start + s.dur) ?? TL.segments.at(-1);
  const t = T - seg.start;
  const local = { ...seg, vo: seg.vo ? { ...seg.vo, at: seg.vo.at } : null };
  let html = scenes[seg.scene](t, local);
  const sub = seg.vo?.caps.find((c) => t >= c.at && t < c.end + .15)?.text ?? null;
  if (sub) html += `<div class="cap"><span>${sub}</span></div>`;
  const fade = Math.min(1, t / .25, (seg.dur - t) / .25);
  S.style.opacity = seg.fadeIn === false ? 1 : 1;
  S.style.color = ['tolls','dec5','gap','works','shake','clip','after','close'].includes(seg.scene) ? 'var(--cream)' : 'var(--ink)';
  S.innerHTML = html;
  await Promise.all([...S.querySelectorAll('img')].map((i) => i.decode().catch(() => {})));
};
</script></body></html>
